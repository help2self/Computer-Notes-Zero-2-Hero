<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Computer Notes — Scholar Computer Institute</title>
<style>
:root{color-scheme:dark;--bg:#000;--cd:#12172A;--tx:#EEF0FA;--mu:#9AA0C0;--ac:#22D6CC;--bd:#2C3348;--gd:#E8B94A;--ok:#2ED888;--bt:#1A2038;--pu:#8C6BFF;--on:#000;--cr:#FF6B7A;--co:#0B1020}
[data-t=l]{color-scheme:light;--bg:#f6f7fb;--cd:#fff;--tx:#1d2433;--mu:#667085;--ac:#2b5fd9;--bd:#e3e6ee;--gd:#8a5a00;--ok:#2e9e5b;--bt:#fff;--pu:#6a4fd8;--on:#fff;--cr:#c23b4d;--co:#eef1f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 system-ui,"Noto Sans Devanagari",Mangal,sans-serif}
a{color:var(--ac);text-decoration:none}header{position:sticky;top:0;z-index:5;background:var(--cd);border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:center;padding:8px 12px}
header b{white-space:nowrap}header b a{color:var(--gd)}header input{flex:1;min-width:0;padding:8px 12px;border:1px solid var(--bd);border-radius:20px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;background:var(--bt);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:6px 12px;cursor:pointer}
main{max-width:1000px;margin:0 auto;padding:14px}.cr{color:var(--mu);font-size:14px;margin-bottom:6px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:12px 0}
.cd{display:block;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;color:var(--tx)}
.cd:hover{border-color:var(--pu)}.cd .i{font-size:30px}.cd h3{margin:4px 0;font-size:17px;line-height:1.4}.cd p{margin:0;color:var(--mu);font-size:14px;line-height:1.5}
.pg{height:6px;background:var(--bd);border-radius:3px;margin-top:10px;overflow:hidden}.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--pu),var(--ac))}
.cd.dn{border-color:var(--ok)}.lay{display:grid;grid-template-columns:260px 1fr;gap:16px}
aside{position:sticky;top:60px;align-self:start;max-height:80vh;overflow:auto;background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:8px}
aside a{display:block;padding:5px 8px;border-radius:8px;color:var(--tx);font-size:14px;line-height:1.4}aside a.on{background:var(--ac);color:var(--on)}aside a.dn:before{content:"✓ ";color:var(--ok)}
article{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px;min-width:0}article h2{margin-top:0;line-height:1.4}
.bx{--c:var(--ac);border:1px solid var(--bd);border-left:4px solid var(--c);background:var(--co);border-radius:10px;padding:10px 14px;margin:14px 0}.bx>summary{color:var(--c)}
.bl{display:block;font-weight:700;margin-bottom:2px;color:var(--c)}.bx p,.bx ul{margin:6px 0}ul{padding-left:22px;margin:8px 0}li::marker{color:var(--ac)}li.n{list-style:none;margin-left:-22px}
.tw{overflow-x:auto;margin:10px 0}table{border-collapse:collapse;min-width:100%;font-size:14px}td,th{border:1px solid var(--bd);padding:6px 10px;vertical-align:top;text-align:left}th{background:var(--bt);color:var(--gd)}
button.on{background:linear-gradient(90deg,var(--pu),var(--ac));color:var(--on);border:0}details.ans>summary{color:var(--ok)}code{background:var(--co);border-radius:4px;padding:1px 5px}details.ans{display:block;margin-top:4px;padding:4px 10px;border:1px dashed var(--ok);border-radius:8px}details>summary{cursor:pointer;color:var(--gd);font-weight:600}
.nv a button{min-width:56px;font-size:20px;line-height:1.2}.nv{display:flex;justify-content:space-between;gap:8px;margin-top:18px;flex-wrap:wrap}.rs a{display:block;background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin:8px 0;color:var(--tx)}.rs small{color:var(--mu);display:block}
@media(max-width:760px){.lay{grid-template-columns:1fr}aside{position:static;max-height:none}}
@media print{header,aside,.nv,button{display:none}.lay{display:block}article{border:0}}
.sh{margin:22px 0 8px;padding-top:12px;border-top:1px solid var(--bd);color:var(--gd);scroll-margin-top:70px}.toc{background:var(--co);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:14px;line-height:2}.hero{text-align:center;background:var(--co);border:1px solid var(--bd);border-radius:16px;padding:22px 16px;margin:6px 0 18px}.br{color:var(--gd);letter-spacing:.18em;font-size:13px;font-weight:700}.cty{color:var(--mu);font-size:14px;margin-bottom:12px}.hero h1{margin:6px 0;font-size:28px;line-height:1.25}.hero p{margin:6px auto;max-width:560px;color:var(--mu)}.hero p.en{color:var(--tx)}.hero .pg{max-width:320px;margin:6px auto 0}
.go{display:inline-block;margin:12px 0 4px;padding:10px 18px;border-radius:12px;background:linear-gradient(90deg,var(--pu),var(--ac));color:var(--on);font-weight:700}
.pm{color:var(--mu);font-size:13px}.gh{color:var(--gd);margin:22px 0 4px;font-size:16px}.chs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chs a{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:20px;padding:5px 12px;font-size:14px}.chs a:hover{border-color:var(--pu)}
.sc{display:block;background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:16px;color:var(--tx)}.sc:hover{border-color:var(--pu)}.sr{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.sr b{font-size:19px;line-height:1.3}.sr small{color:var(--mu);white-space:nowrap}.sc p{margin:6px 0;color:var(--mu);font-size:14px;line-height:1.5}.mt{margin-top:8px;font-weight:600;font-size:14px;border-top:1px solid var(--bd);padding-top:8px}.tp{color:var(--ac);font-size:14px}.lk{color:var(--ac);margin-top:8px;font-size:14px}.ft{text-align:center;color:var(--mu);margin:26px 0 10px;letter-spacing:.08em}
.ctl{display:flex;gap:12px;align-items:center;margin:8px 0 6px}.ci{font-size:34px}.ctl h2{margin:0;line-height:1.3}.rl{margin:8px 0}.rw{display:flex;gap:12px;align-items:center;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0;color:var(--tx)}.rw:hover{border-color:var(--pu)}.rw.dn{border-color:var(--ok)}.nm{flex:none;width:44px;height:44px;border-radius:12px;background:var(--bt);color:var(--ac);display:grid;place-items:center;font-weight:700}.rb{flex:1;min-width:0;line-height:1.4}.rb small{display:block;color:var(--mu);font-size:13px}.rb small.pr{color:var(--ac)}.ar{color:var(--ac);font-size:18px}.dn .ar{color:var(--ok)}.rt{color:var(--mu);font-size:13px;margin:-4px 0 8px}#hm{flex:none;width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--bd);border-radius:12px;background:var(--bt);font-size:18px}header input{padding:10px 16px;font-size:16px;border-radius:24px;height:42px}header button{height:42px}mark{background:var(--gd);color:#000;border-radius:3px;padding:0 2px}</style></head><body>
<header><a id="hm" href="#/" title="Home" aria-label="Home">🏠</a><input id="q" type="search" placeholder="🔎 खोजें — जैसे VLOOKUP, Mail Merge, UPI…" autocomplete="off"><button id="th" title="Dark / Light">🌓</button></header>
<main id="app"></main>
<script>
const app=document.getElementById('app'),CA={};let IDX=[];
const L=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const done=()=>L('done2')||{},TD=document.createElement('textarea'),pl=h=>(TD.innerHTML=h.replace(/<br>/g,' ').replace(/<[^>]+>/g,''),TD.value);
let HC=0;const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),hl=(s,q)=>esc(s).replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark>${m}</mark>`);
const ld=async id=>CA[id]||(CA[id]=await(await fetch(id+'.json?v=20261014')).json());
const bar=(a,b)=>`<div class="pg"><i style="width:${b?100*a/b:0}%"></i></div>`;
const cnt=(c,s)=>Object.keys(done()).filter(k=>k.startsWith(c+'/'+(s===undefined?'':s+'/'))).length;
function ans(h){const i=h.indexOf('✅');return i>0&&/उत्तर|Answer/.test(h.slice(i,i+40))?h.slice(0,i).replace(/(\s|—|–|-|<b>)+$/,'')+`<details class="ans"><summary>उत्तर देखें</summary>${h.slice(i)}</details>`:h}
function nodes(n){let o='',u='';const f=()=>{if(u)o+='<ul>'+u+'</ul>',u=''};
 for(const x of n){if(x.k=='h'){f();o+=`<h3 class="sh" id="g${HC++}">${x.h}</h3>`;continue}if(x.k=='li')u+=`<li${/^\d+[.)]\s/.test(pl(x.h))?' class="n"':''}>${ans(x.h)}</li>`;else{f();o+=x.k=='p'?`<p>${ans(x.h)}</p>`:`<div class="tw"><table>${x.r.map((r,i)=>'<tr>'+r.map(c=>`<${x.hd&&!i?'th':'td'}>${c}</${x.hd&&!i?'th':'td'}>`).join('')+'</tr>').join('')}</table></div>`}}f();return o}
const tone=l=>/❌|⚠|Mistake|गलती|Warning|चेतावनी/i.test(l)?'cr':/✅|उत्तर|Answer|Check|समाधान|Result/i.test(l)?'ok':/🎯|📌|📦|💡|🔁|Important|Remember|Tip|Revision|Did You Know|Smart|याद/i.test(l)?'gd':/📘|Definition|परिभाषा|Key Concept|Glossary|शब्दावली|Summary|सारांश/i.test(l)?'pu':'ac';
const blks=B=>B.map(b=>/answer key|उत्तर/i.test(b.l)&&b.n.length?`<details class="bx" style="--c:var(--ok)"><summary>${b.l}</summary>${nodes(b.n)}</details>`:b.l?`<div class="bx" style="--c:var(--${tone(b.l)})"><div class="bl">${b.l}</div>${nodes(b.n)}</div>`:nodes(b.n)).join('');
const GR={ch03:[['बुनियाद',0,4],['Formatting और Layout',5,9],['Tables, Images और Links',10,12],['Review, Mail Merge और Sharing',13,15],['View, Print और Advanced',16,21],['Shortcuts, Formats और Projects',22,24]],ch04:[['बुनियाद',0,8],['Formula और Functions',9,11],['Data, Tables, Charts और Pivot',12,16],['Print और Advanced Tools',17,23],['Shortcuts, Formats और Projects',24,26]]};
const TP={ch01:'Computer Basics · Hardware · Software',ch02:'Desktop · Start Menu · Files · Folders',ch03:'Formatting · Tables · Page Layout',ch04:'Cells · Formulas · Pivot Table',ch05:'Slides · Themes · Animations',ch06:'Network · Protocols · Security',ch07:'Email · Social Media · e-Governance',ch08:'UPI · Net Banking · Bill Payment',ch09:'Virus · PC सुरक्षा · Safe Browsing',ch10:'AI · IoT · Cloud'};
const SG=[['बुनियाद',['ch01','ch02']],['MS Office',['ch03','ch04','ch05']],['Internet और आगे',['ch06','ch07','ch08','ch09','ch10']]];
const POP=[['Excel Shortcuts','#/ch04/24'],['Word Shortcuts','#/ch03/22'],['Windows Shortcuts','#/ch02/0/20'],['VLOOKUP / Lookup','#/ch04/11/2'],['Pivot Table','#/ch04/15'],['Excel Formulas','#/ch04/9'],['Mail Merge','#/ch03/13'],['UPI और Digital Payment','#/ch08/0/1'],['Email','#/ch07/0/0']];
const nm=s=>pl(s.t).replace(/^[A-Z]?\.?\d+(\.\d+)?\s*[—–-]\s*/,'');
const one=s=>{for(const b of s.intro)for(const n of b.n){const t=pl(n.h||'');if(/उद्देश्य/.test(t)){const r=t.replace(/^.*?उद्देश्य\s*[—:–-]\s*/,'').split('।')[0];return r.length>95?r.slice(0,92)+'…':r}}return s.items.slice(0,3).map(x=>pl(x.t).replace(/^[\d.\s—–-]+/,'')).join(' · ')};
const mins=it=>Math.max(1,Math.round(pl(it.b.map(b=>b.l+' '+b.n.map(n=>(n.h||'')+' '+(n.r||[]).flat().join(' ')).join(' ')).join(' ')).split(/\s+/).length/180));
const rows=(c,A)=>`<div class="rl">${A.map(([si,ii,x],k)=>{const dn=done()[key(c.id,si,ii)];return `<a class="rw${dn?' dn':''}" href="#/${c.id}/${si}/${ii}"><span class="nm">${String(k+1).padStart(2,'0')}</span><span class="rb"><b>${x.t}</b><small>⏱ ~${mins(x)} मिनट</small></span><span class="ar">${dn?'✓':'→'}</span></a>`}).join('')}</div>`;
function home(){const tot=IDX.reduce((a,c)=>a+c.items,0),dn=Math.min(tot,Object.keys(done()).length);
 const sc=c=>`<a class="sc" href="#/${c.id}"><div class="sr"><b>${c.title}</b><small>Subject ${String(IDX.indexOf(c)+1).padStart(2,'0')}</small></div><p>${c.desc}</p><div class="mt">मुख्य Topics</div><div class="tp">${TP[c.id]||''}</div><div class="pm">${c.items} पन्ने · ${cnt(c.id)} हो गए</div>${bar(cnt(c.id),c.items)}<div class="lk">अध्याय देखें →</div></a>`;
 app.innerHTML=`<section class="hero"><div class="br">SCHOLAR COMPUTER INSTITUTE</div><div class="cty">Nizamabad - Azamgarh</div><h1>Interactive Computer Learning</h1><p class="en">Learn step by step. Build real computer skills.</p><p>Computer Fundamentals से लेकर MS Office और Internet तक, अपनी Computer Knowledge को बेहतर बनाएँ।</p><div id="cont"></div><div class="pm">कुल प्रगति: ${dn} / ${tot} पन्ने हो गए</div>${bar(dn,tot)}</section><h3 class="gh">ज़्यादा खोजे जाने वाले विषय</h3><div class="chs">${POP.map(([t,h])=>`<a href="${h}">${t}</a>`).join('')}</div>${SG.map(([l,ids])=>`<h3 class="gh">${l}</h3><div class="g">${ids.map(id=>IDX.find(x=>x.id==id)).filter(Boolean).map(sc).join('')}</div>`).join('')}<div class="ft">Learn · Practice · Revise · Master</div>`;
 const ls=L('last2');if(ls){const q=ls.replace(/^#\/?/,'').split('/');ld(q[0]).then(c=>{const it=c.secs[q[1]]&&c.secs[q[1]].items[q[2]];if(it)document.getElementById('cont').innerHTML=`<a class="go" href="${ls}">▶ आगे पढ़ें: ${(x=>x.length>56?x.slice(0,54)+'…':x)(pl(it.t))}</a>`})}}
const flat=c=>c.secs.flatMap((s,si)=>s.items.map((it,ii)=>({s:si,i:ii,it})));
const toc=it=>{const hs=it.b.flatMap(b=>b.n.filter(x=>x.k=='h').map(x=>x.h));return hs.length>1?`<div class="toc">इस पन्ने पर: ${hs.map((x,i)=>`<a href="#" data-g="g${i}">${x}</a>`).join(' · ')}</div>`:''};
const key=(c,s,i)=>`${c}/${s}/${i}`;
const cards=(c,s,items)=>`<div class="g">${items.map(([si,ii,t])=>`<a class="cd${done()[key(c,si,ii)]?' dn':''}" href="#/${c}/${si}/${ii}"><h3>${t}</h3></a>`).join('')}</div>`;
async function route(){const p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);scrollTo(0,0);
 if(!p[0]){home();return}
 const c=await ld(p[0]),m=IDX.find(x=>x.id==p[0]);let h=`<div class="cr"><a href="#/">Home</a> › <a href="#/${c.id}">${c.icon} ${c.title}</a>`;
 if(p.length==3){const s=c.secs[p[1]],it=s.items[p[2]],F=flat(c),k=F.findIndex(x=>x.s==p[1]&&x.i==p[2]),d=done(),K=key(c.id,p[1],p[2]);
  const nb=(x,t,n)=>x?`<a href="#/${c.id}/${x.s}/${x.i}" aria-label="${n}"><button title="${n}">${t}</button></a>`:'<span></span>';
  app.innerHTML=h+(c.secs.length>1?` › <a href="#/${c.id}/${p[1]}">${s.t}</a>`:'')+`</div><div class="lay"><aside>${s.items.map((x,j)=>`<a class="${j==p[2]?'on ':''}${d[key(c.id,p[1],j)]?'dn':''}" href="#/${c.id}/${p[1]}/${j}">${x.t}</a>`).join('')}</aside><article><h2>${it.t}</h2><div class="rt">⏱ पढ़ने में ~${mins(it)} मिनट</div>${toc(it)}${(HC=0,blks(it.b))}<div class="nv">${nb(F[k-1],'←','पिछला')}<button id="rd"${d[K]?' class="on"':''}>${d[K]?'☑ हो गया':'☐ हो गया?'}</button>${nb(F[k+1],'→','अगला')}</div></article></div>`;
  document.querySelectorAll('.toc a').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.g).scrollIntoView({behavior:'smooth'})});document.getElementById('rd').onclick=()=>{const d=done();d[K]?delete d[K]:d[K]=1;S('done2',d);route()};S('last2',location.hash);return}
 if(p.length==2){const s=c.secs[p[1]];app.innerHTML=h+` › ${nm(s)}</div><h2>${s.t}</h2>${blks(s.intro)}${rows(c,s.items.map((x,j)=>[p[1],j,x]))}`;return}
 const GL=GR[c.id],hd=`</div><div class="ctl"><div class="ci">${c.icon}</div><div><h2>${c.title}</h2><div class="pm">${m.items} पन्ने · ${cnt(c.id)} हो गए</div></div></div>${blks(c.intro)}`;
 if(c.secs.length>1){const mr=(s,si)=>`<a class="rw" href="#/${c.id}/${si}"><span class="nm">${String(si+1).padStart(2,'0')}</span><span class="rb"><b>${nm(s)}</b><small>${one(s)}</small><small class="pr">${cnt(c.id,si)}/${s.items.length} हो गया</small></span><span class="ar">→</span></a>`;
  app.innerHTML=h+hd+(GL?GL.map(([l,a,b])=>`<h3 class="gh">${l}</h3>${c.secs.slice(a,b+1).map((s,k)=>mr(s,a+k)).join('')}`).join(''):c.secs.map(mr).join(''))}
 else app.innerHTML=h+hd+blks(c.secs[0].intro)+rows(c,c.secs[0].items.map((x,j)=>[0,j,x]))}
let T;document.getElementById('q').oninput=e=>{clearTimeout(T);const q=e.target.value.trim().toLowerCase();if(q.length<2){route();return}T=setTimeout(async()=>{
 const R=[];for(const c of IDX){const C=await ld(c.id);C.secs.forEach((s,si)=>s.items.forEach((it,ii)=>{const tx=pl(it.t+' '+it.b.map(b=>b.l+' '+b.n.map(n=>n.h||n.r.flat().join(' ')).join(' ')).join(' ')),j=tx.toLowerCase().indexOf(q);if(j>=0)R.push([it.t.toLowerCase().includes(q)?-1e3:-(tx.toLowerCase().split(q).length-1),`<a href="#/${c.id}/${si}/${ii}" onclick="q.value=''"><b>${it.t}</b><small>${c.title} · …${hl(tx.slice(Math.max(0,j-40),j+90),q)}…</small></a>`])}))}
 R.sort((a,b)=>a[0]-b[0]);app.innerHTML=R.length?`<h2>🔎 ${R.length} नतीजे</h2><div class="rs">${R.slice(0,40).map(r=>r[1]).join('')}</div>`:`<h2>🔎 कोई नतीजा नहीं मिला</h2><p class="pm">कोई दूसरा या छोटा शब्द आज़माइए, जैसे “Formula”, “Shortcut”, “Email”।</p>`},250)};
const th=document.getElementById('th');if(L('t'))document.documentElement.dataset.t=L('t');
th.onclick=()=>{const v=document.documentElement.dataset.t=='l'?'d':'l';document.documentElement.dataset.t=v;S('t',v)};
addEventListener('hashchange',route);fetch('index.json?v=20261014').then(r=>r.json()).then(j=>{IDX=j;route()}).catch(()=>app.innerHTML='<p>Data load नहीं हुआ — site को GitHub Pages/सर्वर से खोलें।</p>');
</script></body></html>
